[build-system]
build-backend = "uv_build"
requires = [ "uv-build~=0.13.5" ]

[project]
name = "pinned-but-mutable"
version = "0.1.0"
description = "Measure residual mutable references in CI workflows whose GitHub Actions are pinned to commit SHAs"
readme = "README.md"
keywords = [
  "github-actions",
  "pinning",
  "research",
  "supply-chain",
]
license = "Apache-2.0"
authors = [ { name = "Carlos Meza", email = "carlos@digitalr00ts.com" } ]
requires-python = ">=3.14,<4"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "pinref",
  "pyyaml~=6.0",
]

[dependency-groups]
test = [
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
]
build = [
  "build~=1.2",
  "check-wheel-contents>=0.6",
  "twine~=7.0",
]
ci = [
  "tox-gh~=1.8",
  "tox-uv~=1.36",
]
lint = [ "prek~=0.3" ]
presentation = [ "marimo~=25.2" ]
typecheck = [
  "pyrefly~=1.2",
]

[tool.uv]
# The scanner imports private pinref collectors; pin the exact commit under study.
sources.pinref = { git = "https://github.com/drts01/pinref", rev = "e3164b177544ac23d74509791bd508255cf7dfdb" }
build-backend.module-name = "corpus_scanner"

[tool.ruff]
target-version = "py314"
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DOC",   # pydoclint
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff-specific
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "COM812", # trailing-comma-missing — conflicts with ruff format
  "D203",   # one-blank-line-before-class — conflicts with D211
  "D213",   # multi-line-summary-second-line — conflicts with D212
]
lint.explicit-preview-rules = true
lint.per-file-ignores."src/corpus_scanner/tests/*" = [
  "ANN",     # flake8-annotations — test signatures use minimal types
  "D",       # pydocstyle — tests don't need comprehensive docstrings
  "PLR2004", # Pylint magic-value-comparison — asserting literal expected values is normal in tests
  "S101",    # flake8-bandit assert_used — assertions in tests expected
]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 9
lint.pylint.max-branches = 13
lint.pylint.max-positional-args = 7
lint.preview = true

[tool.interrogate]
fail-under = 100
ignore-semiprivate = true
ignore-private = true
ignore-nested-functions = true
exclude = [ "presentation/", "src/corpus_scanner/tests/" ]
verbose = 2
style = "google"
typecheck = [
  "pyrefly~=1.2",
]

[tool.pytest]
addopts = [
  "--strict-markers",
  "--tb=short",
]
testpaths = [ "src" ]

[tool.coverage]
run.source_pkgs = [ "corpus_scanner" ]
run.omit = [ "**/__pycache__/*", "*/tests/*" ]
report.exclude_lines = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
report.show_missing = true

[tool.rumdl]
output-format = "grouped"
exclude = [ "corpus/" ]
extend-enable = [
  "table-format",                  # MD060
  "nested-code-fence",             # MD070
  "heading-anchor-collision",      # MD080
  "mojibake",                      # MD083
  "invisible-characters",          # MD084
  "paragraph-continuation-indent", # MD085
  "unused-disable-comment",        # MD087
  "quotes-dashes",                 # MD088
]
disable = [
  "no-inline-html", # MD033
  "no-bare-urls",   # MD034
]
# MD003
heading-style.style = "atx"
# MD013
line-length.line-length = 120
line-length.code_blocks = false
line-length.code_spans = false
line-length.tables = false
line-length.blockquotes = false
line-length.reflow = true
line-length.reflow-mode = "semantic-line-breaks"
per-file-flavor."*.md" = "gfm"
# MD060
table-format.style = "aligned"

[tool.ryl]
ignore-from-file = [ ".gitignore" ]
files.yaml = [ "*.y*ml" ]
files.markdown = [ "*.md" ]
per-line-ignores = [
  { path = "**/.github/workflows/*.y*ml", regex = "^on:", rules = [ "truthy" ] },
  { path = "**/*.md", regex = "^ *on:", rules = [ "truthy" ] },
  { path = "**/*.md", regex = "image:", rules = [ "key-duplicates" ] },
]
lint.rules.anchors = "enable"
lint.rules.brackets = "enable"
lint.rules.colons = "enable"
lint.rules.commas = "enable"
lint.rules.empty-lines = "enable"
lint.rules.empty-values = "enable"
lint.rules.hyphens = "enable"
lint.rules.octal-values = "enable"
lint.rules.new-line-at-end-of-file = "enable"
lint.rules.new-lines = "enable"
lint.rules.trailing-spaces = "enable"
lint.rules.truthy = "enable"
lint.rules.braces.max-spaces-inside = 1
lint.rules.braces.max-spaces-inside-empty = 2
lint.rules.braces.min-spaces-inside-empty = 0
lint.rules.comments.min-spaces-from-content = 1
lint.rules.comments-indentation.allow-any-open-indent = true
lint.rules.document-end.present = false
lint.rules.document-start.present = true
lint.rules.float-values.require-numeral-before-decimal = true
lint.rules.indentation.spaces = 2
lint.rules.indentation.indent-sequences = true
lint.rules.key-duplicates.forbid-duplicated-merge-keys = true
lint.rules.key-duplicates.check-canonical = true
lint.rules.key-duplicates.forbid-merge-key-shadowing = true
lint.rules.line-length.max = 120
lint.rules.quoted-strings.quote-type = "single"
lint.rules.quoted-strings.required = "only-when-needed"
lint.rules.quoted-strings.allow-quoted-quotes = true
lint.rules.quoted-strings.allow-double-quotes-for-escaping = true

[tool.tombi]
files.exclude = [ "pyproject.toml" ]
format.rules.array-bracket-space-width = 1
format.rules.array-comma-space-width = 1
format.rules.inline-table-brace-space-width = 1
format.rules.inline-table-comma-space-width = 1
format.rules.line-width = 120
format.rules.trailing-comment-space-width = 2
